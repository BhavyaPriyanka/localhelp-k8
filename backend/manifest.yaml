---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: localhelp
data:
  DB_HOST: db-dev.localhelp.store  # this is mysql component service name
  DB_PORT: "3306"
  DB_NAME: appdb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: localhelp
  labels:
    app: backend
    purpose: deployment
    tier: backend-app
    project: localhelp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend
      purpose: deployment
      tier: backend-app
      project: localhelp

  template:
    metadata:
      labels:
        app: backend
        purpose: deployment
        tier: backend-app
        project: localhelp

    spec:
        # Runs BEFORE the backend container
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."

              until nc -z db-dev.localhelp.store 3306; do
                echo "MySQL is not ready yet..."
                sleep 2
              done

              echo "MySQL is ready!"

      containers:
        - name: backend
          image: sbp828/backend:v1.3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"

          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 60
            periodSeconds: 5

          readinessProbe:
            tcpSocket:
             port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5

          envFrom:
            - configMapRef:
                name: backend
            - secretRef:
                name: backend-db

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: localhelp

spec:
  selector:
    app: backend
    purpose: deployment
    tier: backend-app
    project: localhelp

  ports:
    - protocol: TCP
      port: 8080  # service-port
      targetPort: 8080  # target-port
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-db
  namespace: localhelp
type: Opaque
stringData:
  DB_USERNAME: appuser
  DB_PASSWORD: localhelp
