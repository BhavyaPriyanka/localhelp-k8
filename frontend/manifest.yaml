---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: localhelp
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /auth/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
}

      location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /health {
        stub_status on;
        access_log off;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: localhelp
  labels:
    app: frontend
    purpose: deployment
    tier: frontend-app
    project: localhelp
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend
      purpose: deployment
      tier: frontend-app
      project: localhelp

  template:
    metadata:
      labels:
        app: frontend
        purpose: deployment
        tier: frontend-app
        project: localhelp

    spec:
      containers:
        - name: frontend
          image: sbp828/frontend:v1.1

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true

      volumes:
        - name: nginx-conf
          configMap:
            name: frontend
            items:
              - key: nginx.conf
                path: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: localhelp
spec:
  type: ClusterIP

  selector:
    app: frontend
    purpose: deployment
    tier: frontend-app
    project: localhelp

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: frontend-targetgroup
  namespace: localhelp
spec:
  serviceRef:
    name: frontend
    port: 80

  targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:837206354502:targetgroup/localhelp-dev-frontend/7a36b355cff8fb91

  targetType: ip