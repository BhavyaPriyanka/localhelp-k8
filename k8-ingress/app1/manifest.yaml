apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1
  labels:
    app: app1
    purpose: ingress
    tier: frontend
spec:
  selector:
      matchLabels:
        app: app1
        tier: frontend
        purpose: ingress
  template:
     metadata:
      labels:
        app: app1
        tier: frontend
        purpose: ingress
     spec:
      containers:
      - name: app1
        image: sbp828/app1:v1.0
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    app: app1
    purpose: ingress
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: app1.localhelp.online
    http:
      paths:
      - path: /app1
        pathType: Prefix
        backend:
          service:
            name: app1
            port:
              number: 80